 
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Techno Soft</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
         <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            margin: 0;
        }


        .navbar {
            background: #1677ff;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .navbar h2 {
            margin: -0;
        }


        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }


        .profile-container {
            width: 700px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
            overflow: hidden;
        }


        .profile-title {
            background: #1677ff;
            color: white;
            text-align: center;
            padding: 20px;
        }


        .profile-title h1 {
            margin: 0;
        }


        .profile-body {
            padding: 30px;
        }


        .row {
            display: flex;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }


        .label {
            width: 40%;
            font-weight: bold;
            color: #555;
        }


        .value {
            width: 60%;
            color: #222;
        }


        .logout {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }


        .logout:hover {
            background: #bb2d3b;
        }

    </style>
</head>

<body class="bg-light">
     <!-- Spinner Start -->
    <div id="spinner"
        class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!-- Spinner End -->
    <!-- Navbar Start -->
     

        <div class="navbar">

        <h2>Techno Soft</h2>

        <div>

            <a href="{% url 'index' %}">
                Home
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        </div>

    </div>    <!-- Navbar End -->



     
    <!-- Registration Form -->
    <div class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-7">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0">Student Registration Form</h3>
                    </div>

                    <div class="card-body p-4">

                        <!-- Success Message -->
                        {% if success %}
                            <div class="alert alert-success">
                                {{ success }}
                            </div>
                        {% endif %}

                        <!-- Error Message -->
                        {% if error %}
                            <div class="alert alert-danger">
                                {{ error }}
                            </div>
                        {% endif %}

                        <!-- Registration Form -->
                        <form method="POST" action="">

                            {% csrf_token %}

                            <!-- Student Name -->
                            <div class="mb-3">
                                <label for="studentName" class="form-label">
                                    Student Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="studentName"
                                    name="student_name"
                                    placeholder="Enter student name"
                                    required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter email address"
                                    required>
                            </div>

                            <!-- Phone -->
                            <div class="mb-3">
                                <label for="phone" class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    name="phone"
                                    placeholder="Enter phone number"
                                    required>
                            </div>

                            <!-- Date of Birth -->
                            <div class="mb-3">
                                <label for="dob" class="form-label">
                                    Date of Birth
                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="dob"
                                    name="dob"
                                    required>
                            </div>

                            <!-- Gender -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Gender
                                </label>

                                <div>

                                    <div class="form-check form-check-inline">
                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="male"
                                            value="Male"
                                            required>

                                        <label
                                            class="form-check-label"
                                            for="male">
                                            Male
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="female"
                                            value="Female">

                                        <label
                                            class="form-check-label"
                                            for="female">
                                            Female
                                        </label>
                                    </div>

                                    <div class="form-check form-check-inline">
                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="gender"
                                            id="other"
                                            value="Other">

                                        <label
                                            class="form-check-label"
                                            for="other">
                                            Other
                                        </label>
                                    </div>

                                </div>
                            </div>

                            <!-- Course -->
                            <div class="mb-3">

                                <label for="course" class="form-label">
                                    Course
                                </label>

                                <select
                                    class="form-select"
                                    id="course"
                                    name="course"
                                    required>

                                    <option value="">
                                        Select Course
                                    </option>

                                    <option value="BCA">BCA</option>
                                    <option value="BBA">BBA</option>
                                    <option value="BCom">B.Com</option>
                                    <option value="BSc">B.Sc</option>
                                    <option value="MCA">MCA</option>
                                    <option value="MBA">MBA</option>

                                </select>

                            </div>

                            <!-- Address -->
                            <div class="mb-3">

                                <label for="address" class="form-label">
                                    Address
                                </label>

                                <textarea
                                    class="form-control"
                                    id="address"
                                    name="address"
                                    rows="3"
                                    placeholder="Enter your address"
                                    required></textarea>

                            </div>

                            <!-- City and State -->
                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label for="city" class="form-label">
                                        City
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="city"
                                        name="city"
                                        placeholder="Enter city"
                                        required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label for="state" class="form-label">
                                        State
                                    </label>

                                    <select
                                        class="form-select"
                                        id="state"
                                        name="state"
                                        required>

                                        <option value="">
                                            Select State
                                        </option>

                                        <option value="Karnataka">Karnataka</option>
                                        <option value="Maharashtra">Maharashtra</option>
                                        <option value="Telangana">Telangana</option>
                                        <option value="Tamil Nadu">Tamil Nadu</option>
                                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                                        <option value="Kerala">Kerala</option>
                                        <option value="Delhi">Delhi</option>

                                    </select>

                                </div>

                            </div>

                            <!-- Password -->
                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Create password"
                                    minlength="6"
                                    required>

                            </div>

                            <!-- Confirm Password -->
                            <div class="mb-3">

                                <label for="confirmPassword" class="form-label">
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirmPassword"
                                    name="confirm_password"
                                    placeholder="Confirm password"
                                    minlength="6"
                                    required>

                            </div>

                            <!-- Terms -->
                            <div class="mb-3 form-check">

                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="terms"
                                    required>

                                <label
                                    class="form-check-label"
                                    for="terms">

                                    I agree to the terms and conditions.

                                </label>

                            </div>

                            <!-- Buttons -->
                            <div class="d-grid gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg">
                                    Register Student
                                </button>

                                <button
                                    type="reset"
                                    class="btn btn-secondary">
                                    Clear Form
                                </button>

                            </div>

                        </form>

                    </div>

                    <div class="card-footer text-center text-muted">
                        Already registered?
                        <a href="/login/">Login here</a>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap 5 JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
